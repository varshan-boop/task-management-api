kind = "api"
previewPath = "/api"
title = "Task Management API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/", "/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "sync", "--project", "."]

[services.production.run]
args = ["uv", "run", "--project", ".", "--no-sync", "uvicorn", "main:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"